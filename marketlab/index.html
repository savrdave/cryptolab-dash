<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="color-scheme" content="light dark">
<title>MarketLab</title>
<style>
:root{--page:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--mute:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--good:#006300;--goodbg:#0ca30c;--warn:#fab219;--bad:#d03b3b;--badtx:#b02a2a;--mid:#f0efec;--chip:#efeee9}
@media(prefers-color-scheme:dark){:root{--page:#0d0d0d;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--mute:#898781;--grid:#2c2c2a;--axis:#383835;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--good:#0ca30c;--badtx:#e66767;--mid:#383835;--chip:#262624}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{padding:14px 16px 6px}h1{font-size:19px;margin:0}.sub{color:var(--mute);font-size:12px}
nav{position:sticky;top:0;z-index:5;background:var(--page);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--grid);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--grid);background:var(--card);color:var(--ink2);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px}
nav button.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--grid);border-radius:12px;padding:13px 14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h2 small{font-weight:400;color:var(--mute);font-size:11px;white-space:nowrap}
h3{font-size:13px;margin:12px 0 4px;color:var(--ink2)}
.hero{font-size:17px;font-weight:600;line-height:1.35}
p{margin:6px 0}.m{color:var(--mute);font-size:12px}.s{font-size:13px;color:var(--ink2)}
.row{padding:9px 0;border-top:1px solid var(--grid)}.row:first-of-type{border-top:0}
.row b{font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--chip);color:var(--ink2);white-space:nowrap}
.pill.on{background:var(--bad);color:#fff}.pill.go{background:var(--goodbg);color:#fff}.pill.arm{background:var(--warn);color:#0b0b0b}
.up{color:var(--good)}.dn{color:var(--badtx)}
.tw{overflow-x:auto;margin:0 -4px}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 6px;text-align:right;border-top:1px solid var(--grid);white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--mute);font-weight:500;font-size:11px;border-top:0}th:first-child,td:first-child{text-align:left;white-space:normal;min-width:104px}
td.l,th.l{text-align:left;white-space:normal}
details{margin-top:4px}summary{color:var(--s1);font-size:12px;cursor:pointer}
svg{display:block;width:100%;height:auto;touch-action:pan-y}.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin:4px 0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.tip{font-size:12px;color:var(--ink2);min-height:18px;font-variant-numeric:tabular-nums}
.idea{border-left:3px solid var(--s1);padding:2px 0 2px 10px;margin:10px 0}
.seg{display:inline-flex;border:1px solid var(--grid);border-radius:8px;overflow:hidden;margin:4px 0}.seg button{border:0;background:none;color:var(--ink2);padding:5px 12px;font:inherit;font-size:13px}
.seg button.on{background:var(--ink);color:var(--page)}
.hm{display:grid;gap:1px;font-size:10px;align-items:center}.hm span{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.hm div{aspect-ratio:1;border-radius:2px}
footer{color:var(--mute);font-size:11px;padding:8px 16px 28px;max-width:760px;margin:0 auto}
.warn{border-color:var(--bad)}.spk{width:64px;display:inline-block;vertical-align:middle}
.q{position:relative;display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--axis);background:none;color:var(--ink2);font:600 11px/1 inherit;padding:0;margin-left:5px;vertical-align:middle;cursor:pointer;flex:none}
.q::after{content:"";position:absolute;inset:-9px}
#help{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
#help[hidden]{display:none}
#help .hb{background:var(--card);color:var(--ink);border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));max-width:760px;width:100%;border-top:1px solid var(--grid)}
#help p{margin:6px 0 12px;font-size:15px}#help button{border:1px solid var(--grid);background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 18px;font:inherit}
.sig .means{color:var(--ink2);font-size:13px;margin:4px 0}.sig .st{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:5px 0}
.dist{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.need{border-left:3px solid var(--warn);padding-left:9px}
.more{display:block;width:100%;margin-top:10px;border:1px solid var(--grid);background:var(--chip);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:14px}
.card:not(.all) .xtra{display:none}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:2px 6px;font-size:13px;font-variant-numeric:tabular-nums;margin-top:5px}
.g5 span{white-space:nowrap}.g5.hd{font-size:11px;color:var(--mute);border-bottom:1px solid var(--grid);padding-bottom:6px;margin-top:8px}
.g5.hd span{white-space:normal;display:flex;align-items:center}
.sum{font-weight:600;font-size:15px;margin:0 0 6px}
.strip{display:flex;flex-wrap:wrap;gap:2px;margin:5px 0 2px}.strip i{width:9px;height:14px;border-radius:2px;background:var(--mid)}
.strip i.A{background:var(--warn)}.strip i.O{background:var(--s1)}.strip i.N{background:none;border:1px dashed var(--axis)}
.gl dt{font-weight:600;margin-top:12px}
pre{font:11px/1.35 ui-monospace,Menlo,monospace;overflow-x:auto;background:var(--chip);border-radius:8px;padding:8px;margin:6px 0;white-space:pre}.gl dd{margin:2px 0 0;color:var(--ink2);font-size:14px}
/* chart-first layout */
.sec{scroll-margin-top:56px}
.sn{display:flex;align-items:center;gap:2px;font-size:14px;font-weight:600;color:var(--ink2)}.sn small{margin-left:auto;font-weight:400;font-size:11px;color:var(--mute)}
.bn{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:2px 0 0}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.bl{color:var(--mute);font-size:12px;margin:1px 0 6px}
.chip{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.chip b{font-weight:700;letter-spacing:.02em}.chip.go{background:var(--goodbg);color:#fff}.chip.on{background:var(--bad);color:#fff}.chip.arm{background:var(--warn);color:#0b0b0b}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.tb{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 4px}
.tb .seg{margin:0}.tb .seg button{padding:5px 10px}
.lgb{border:1px solid var(--grid);background:none;color:var(--ink2);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px}.lgb.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
.lw{position:relative;width:100%;touch-action:pan-y}
.lw table{width:auto}.lw td,.lw th{min-width:0!important;padding:0!important;border:0!important;white-space:normal}
.tip .k{white-space:nowrap;margin-right:8px}.tip .k i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.bands{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11px;color:var(--mute);margin-top:2px}.bands i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.as{display:flex;gap:6px;margin:6px 0 2px}.as .seg{margin:0}
details.dt{margin-top:8px;border-top:1px solid var(--grid);padding-top:6px}details.dt>summary{font-size:13px}
.tiles{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -12px 12px;padding:2px 12px 6px;scrollbar-width:none}.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 136px;scroll-snap-align:start;text-align:left;border:1px solid var(--grid);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 10px 8px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tile .tn{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .tv{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .tu{font-size:10px;color:var(--mute);white-space:nowrap}.tile .chip{align-self:flex-start;padding:2px 8px;font-size:11px}.tile svg{width:100%;height:22px}
.tile .nochip{font-size:11px;color:var(--mute);height:20px;display:flex;align-items:center}
.sr{display:flex;align-items:center}.sig .st{margin:4px 0 0}
.bars{display:grid;grid-template-columns:52px 1fr 48px;gap:4px 6px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.bars .tr{position:relative;height:14px}.bars .tr::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid var(--axis)}
.bars .br{position:absolute;top:2px;height:10px;border-radius:2px}.bars .v{text-align:right;color:var(--ink2)}
.cl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.cl .chip{white-space:normal}
.mini{font-size:12px;color:var(--ink2);margin:4px 0}
</style></head><body>

  l.funds.map(f=>f.missing?[`${esc(f.t)}`,...Array(8).fill(NA)]:[`<b>${esc(f.t)}</b> ${f.ca?"🇨🇦":""}<br><span class="m">${esc(f.label)}</span>`,pill(f.trend||"n/a",f.trend=="up"?"go":""),pct(f.vs200),pct(f.rel63),pct(f.d21),pct(f.selloffs[has]),pct(f.sell_avg)+` <span class="m">(${f.sell_n})</span>`,pct(f.after5),spark(f.spark)])))});
 return h};

V.divers=()=>{const x=D.divers;if(una(x))return card("Diversification",una(x));let h="";
 h+=sec("corr",{title:"Correlation grid",g:"link",big:x.avg_now.toFixed(2),sub:`average link now${x.avg_year!=null?" · "+x.avg_year.toFixed(2)+" over the last year":""}`,chip:chip(x.jump?"ON":"OFF","warning","jump")+cchip("danger","danger"),date:x.date},
  `<div class="seg" id="hmseg"><button type="button" data-k="m3">3 months</button><button type="button" data-k="m12" class="on">1 year</button></div><div id="hm"></div><div class="tip" id="hmt">Tap a square to read the pair</div><div class="lg"><span><i style="background:var(--s1)"></i>move opposite (−1)</span><span><i style="background:var(--mid)"></i>unrelated (0)</span><span><i style="background:var(--s2)"></i>move together (+1)</span></div>`,
  `<p class="s">${esc(x.jump_text)}</p><p class="s">Danger flag (yields jumping with a rising dollar): ${x.danger_on?"ON":"off"}.</p>`+(x.pairs.length?`<h3>Pairs that tightened most (1 year → 3 months)</h3>`+x.pairs.map(p=>`<p class="s">${esc(p[0])} and ${esc(p[1])}: ${p[2].toFixed(2)} → ${p[3].toFixed(2)}</p>`).join(""):"")+(x.usd_avg!=null?`<p class="s">US dollars vs everything else, last 3 months: average link ${x.usd_avg.toFixed(2)} (below zero = it has been a cushion).</p>`:"")+sigTxt(CARD("danger")));
 h+=sec("bets",{title:"How many bets is this really?",g:"bets",big:x.bets+" of "+x.n,sub:"holdings that really move on their own",date:x.date},"",`<p class="s">${esc(x.line)}</p>`+x.groups.map((g,i)=>`<p class="s"><b>Bet ${i+1}${g.members.length>1?` (${g.members.length} holdings, average link ${g.avg.toFixed(2)})`:""}:</b> ${g.members.map(esc).join(", ")}</p>`).join("")+`<p class="m">${esc(x.how)}</p>`);
 h+=card("When everything falls together (research3)",`<details><summary>${x.findings.length} findings</summary>`+x.findings.map(f=>`<p class="s">• ${esc(f)}</p>`).join("")+`</details>`);return h};
function heat(k){const x=D.divers,n=x.labels.length,el=document.getElementById("hm");if(!el)return;
 const col=v=>v==null?"var(--mid)":`color-mix(in oklab, ${v>=0?"var(--s2)":"var(--s1)"} ${Math.round(Math.min(1,Math.abs(v))*100)}%, var(--mid))`;
 let h=`<div class="hm" style="grid-template-columns:78px repeat(${n},1fr)">`;
 x[k].forEach((r,i)=>{h+=`<span>${esc(x.labels[i])}</span>`+r.map((v,j)=>`<div style="background:${i==j?"var(--grid)":col(v)}" data-i="${i}" data-j="${j}"></div>`).join("")});
 el.innerHTML=h+"</div>";el.onclick=el.onpointermove=e=>{const d=e.target.dataset;if(d&&d.i!=null&&d.i!=d.j)document.getElementById("hmt").innerHTML=`${esc(x.labels[d.i])} and ${esc(x.labels[d.j])}: <b>${x[k][d.i][d.j].toFixed(2)}</b> (3 months ${x.m3[d.i][d.j].toFixed(2)}, 1 year ${x.m12[d.i][d.j].toFixed(2)})`};
 document.querySelectorAll("#hmseg button").forEach(b=>{b.classList.toggle("on",b.dataset.k==k);b.onclick=()=>heat(b.dataset.k)})}

V.watch=()=>{const x=D.watch;if(una(x))return card("Watchlist",una(x));const S=5;
 const hd=v=>`<div class="g5 hd"><span>7 days${q("d7")}</span><span>30 days${q("d30")}</span><span>90 days${q("d90")}</span><span>From high${q("fromhigh")}</span><span>${v=="BTC"?"vs BTC":"vs index"}${q(v=="BTC"?"vsbtc":"vsindex")}</span></div>`;
 const one=(r,name,i)=>r.missing?`<div class="row${i>=S?" xtra":""}"><b>${esc(name)}</b> <span class="m">data unavailable</span></div>`:`<div class="row${i>=S?" xtra":""}"><b>${esc(name)}</b> ${num(r.price)} ${spark(r.spark)} <span class="m">${esc(fd(r.date))}</span>
  <div class="g5"><span>${pc(r.d7)}</span><span>${pct(r.d30,0)}</span><span>${pct(r.d90,0)}</span><span>${pct(r.off_high,0)}</span><span>${r.rel==null?'<span class="m">yardstick</span>':pct(r.rel,0)}</span></div>
  <details><summary>More: trend, volume, what history says</summary><p class="s">vs 200-day average${q("vs200")}: ${pct(r.vs200)} · volume${q("volume")}: ${r.vol==null?"n/a":r.vol.toFixed(2)+"x its yearly average"}${r.rel==null?"":` · strength is measured vs ${esc(r.rel_to)}`}</p><p class="s"><b>What history says:</b> ${esc(r.hist)}</p></details></div>`;
 let h=card("Read this first",`<details><summary>How to read these numbers</summary>`+`<p class="s"><b>Own change vs comparison.</b> The first three numbers are how much each asset's own price moved over 7, 30 and 90 days. "From high" is how far it sits below its peak.</p>
  <p class="s"><b>Why compare with bitcoin (or an index)?</b> Most coins move with bitcoin, and most funds move with the stock market. The last number shows whether an asset did better (+) or worse (−) than just holding bitcoin, or the plain index, over 3 months. An asset can be down and still be holding up well.</p>
  <p class="m">Each list shows the ${S} that moved most over 7 days, up or down. Tap "Show all" for the rest. Only the 7-day column is coloured.</p>`+`</details>`);
 const co=bySwing(x.coins),fu=bySwing(x.funds);
 h+=card("Coins",(x.coins_line?`<p class="sum">${esc(x.coins_line)}</p>`:"")+hd("BTC")+co.map((c,i)=>one(c,c.t,i)).join("")+more(co.length,S,"coins")+`<p class="m">${esc(x.hist_asof)}</p>`);
 h+=card("Funds",(x.funds_line?`<p class="sum">${esc(x.funds_line)}</p>`:"")+hd("IDX")+fu.map((f,i)=>one(f,`${f.t} · ${f.label}`,i)).join("")+more(fu.length,S,"funds")+`<p class="m">${esc(x.hist_asof)}</p>`);
 const a=x.ant;let b=a.trading?`<p class="hero">$${num(a.price,2)} · ${sp(a.since)} since the day-one open ($${num(a.open0,2)})</p><p class="s">Trading day ${a.day}.${a.compare?` The typical tech IPO at ${esc(a.compare.at)}: ${a.compare.typ>0?"+":""}${a.compare.typ}% (up ${a.compare.up}% of the time).`:""}</p>`:`<p>Not trading yet. It lists on ${esc(fd(a.listing))}; numbers appear after its first close.</p>`;
 if(a.typical)b+=`<details><summary>How 47 past tech IPOs moved from the day-one open</summary>`+tbl(["After","Typical move","Share that were up"],a.typical.map(t=>[esc(t[3]),(t[1]>0?"+":"")+t[1]+"%",t[2]+"%"]))+`</details>`;
 h+=card("ANT (Anthropic)",b+`<p class="m">Data only. No opinion. ${esc(a.src)}.</p>`,a.date);return h};

V.events=()=>{const x=D.events;if(una(x))return card("World events",una(x));
 const c=v=>v==null?'<span class="m">too soon</span>':pct(v);
 let h=card("Which kinds of events have mattered",tbl(["Kind","Cases","Sector fund","1 day","5 days","20 days"],x.summary.map(s=>[esc(s.category),s.n,esc(s.fund),c(s.r1),c(s.r5),c(s.r20)]))+`<p class="m">Typical (median) move of the sector fund minus the S&P 500. Few cases: read as a record, not a rule.</p><p class="m">${esc(x.how)}</p>`+(x.notes.length?`<p class="m">Today: ${x.notes.map(esc).join("; ")}.</p>`:""),x.date);
 h+=card("Event log",x.rows.map(r=>`<div class="row"><b>${esc(r.date)}</b> ${pill(r.category)} ${r.origin=="live"?"":'<span class="m">history</span>'}<p>${esc(r.event)}</p><p class="s">${esc(r.etf)} vs S&P: 1 day ${c(r.r1)} · 5 days ${c(r.r5)} · 20 days ${c(r.r20)}${r.sources?` <span class="m">(${esc(r.sources)})</span>`:""}</p></div>`).join("")||`<p class="m">No events yet.</p>`);
 return h};

V.calendar=()=>{const x=D.calendar;if(una(x))return card("Calendar",una(x));let last="";
 let h=card("Next 2 weeks",(x.items.length?x.items.map(i=>{const d=i.date!=last?`<h3>${esc(i.dow)} ${esc(i.date)}</h3>`:"";last=i.date;return d+`<p>${esc(i.what)} <span class="m">${esc(i.src)}</span></p>`}).join(""):`<p class="s">Nothing found for the next two weeks.</p>`)+x.notes.map(n=>`<p class="m">${esc(n)}</p>`).join(""),x.asof);
 h+=card("Next big dates",Object.entries(x.next).map(([k,v])=>`<p>${esc(k)}: <b>${esc(v)}</b></p>`).join("")||`<p class="m">Data unavailable</p>`);return h};

V.paper=()=>{const x=D.paper;if(una(x))return card("Paper lab",una(x));const c=C_();let n=0;
 const one=b=>{n++;const id="book"+n;if(b.error)return card(b.name,`${chip("problem")}<p class="s">${esc(b.error)}</p>`,null,"warn");
  if(!b.running)return sec(id,{title:b.name,big:"waiting",sub:esc(b.words||""),date:null},"",`<p class="s"><b>The rule:</b> ${esc(b.rule||"")}</p>${b.success?`<p class="m">Success would be: ${esc(b.success)}</p>`:""}${b.pending&&Object.keys(b.pending).length?`<p class="s">Order waiting for the next close.</p>`:""}`);
  const s=b.series||[],bn=b.bench_name||"Buy and hold";
  const ch=s.length>2?lwc({lines:[{name:"Book",data:dser(s.map(r=>[r[0],r[1]])),color:c.p},{name:bn,data:dser(s.map(r=>[r[0],r[2]])),color:c.ink,w:1.5,dash:true}],ranges:s.length>400?["3M","1Y","All"]:["All"],start:"All",h:170,fmt:v=>"$"+Math.round(v).toLocaleString("en-CA")}):`<p class="m">Chart appears after a few days of records.</p>`;
  return sec(id,{title:b.name,g:"paper",big:pc(b.ret),sub:`vs ${pct(b.bench_ret)} for ${esc(bn)} · since ${esc(fd(b.since))}${b.early?" · too early to judge":""}`,date:b.asof},ch,
   `<p class="s">${esc(b.words||"")}</p>`+tbl(["","Book",esc(bn)],[["Return",pc(b.ret),pct(b.bench_ret)],["Worst drop",pct(b.dd),pct(b.bench_dd)],["Trades",b.trades==null?NA:b.trades,""],["Costs paid",b.costs==null?'<span class="m">inside the value</span>':"$"+num(b.costs,2),b.bench_costs!=null?"$"+num(b.bench_costs,2):""],["Value",usd(b.value),b.bench_value!=null?usd(b.bench_value):""]])+
   `${b.note?`<p class="m">${esc(b.note)}</p>`:""}${b.rule?`<p class="s"><b>The rule:</b> ${esc(b.rule)}</p>`:""}${b.holding?`<p class="s">Holding: ${Object.entries(b.holding).map(([k,v])=>esc(k)+" "+(v*100).toFixed(0)+"%").join(", ")}${b.pending&&Object.keys(b.pending).length?" · order waiting for the next close":""}</p>`:""}${b.success?`<p class="m">Success would be: ${esc(b.success)}</p>`:""}`)};
 const all=x.core.concat(x.sandbox),lw=x.line_watch;
 // scoreboard: one bar pair per running book (book vs benchmark), everything else behind the tap
 const run=all.filter(b=>b.running&&b.ret!=null),mx=Math.max(.01,...run.flatMap(b=>[Math.abs(b.ret),Math.abs(b.bench_ret||0)]));
 const bar=(v,col)=>{const w=Math.abs(v)/mx*50;return `<span class="tr"><span class="br" style="${v<0?`right:50%;width:${w}%`:`left:50%;width:${w}%`};background:${col}"></span></span>`};
 let h=sec("score",{title:"Scoreboard",g:"paper",big:`${run.filter(b=>b.ret>(b.bench_ret||0)).length} of ${run.length}`,sub:"running books ahead of their benchmark · pretend money",date:null},
  `<div class="bars" style="grid-template-columns:minmax(0,1fr) 1fr 52px">${run.map(b=>`<span class="m" style="grid-column:1/4;color:var(--ink2);margin-top:4px">${esc(b.name)}</span><span class="m">book</span>${bar(b.ret,"var(--s1)")}<span class="v">${sp(b.ret)}</span><span class="m">benchmark</span>${bar(b.bench_ret||0,"var(--axis)")}<span class="v">${sp(b.bench_ret)}</span>`).join("")}</div>`,
  `<p class="s">A book needs 6 months before its result means anything${q("early")}.</p>`+all.map(b=>`<p class="s"><b>${esc(b.name)}</b> <span class="m">${esc(b.track||"")}</span> ${esc(b.error||b.words||"")}</p>`).join("")+
  (lw&&lw.ret!=null?`<p class="s"><b>${esc(lw.name)}</b> ${pct(lw.ret)} on $${num(lw.cost,0)} of paper buys</p>`:""));
 h+=`<h3 style="margin:16px 4px 8px">Core books (frozen rules)${q("core")}</h3>`+x.core.map(one).join("");
 if(lw)h+=lw.error?card(lw.name||"Line watch paper",`<p class="m">${esc(lw.error)}</p>`):sec("linepaper",{title:lw.name||"Line watch paper",g:"linewatch",big:pc(lw.ret),sub:`on $${num(lw.cost,0)} of paper buys · ${lw.buys} buys`,date:lw.asof},
  tbl(["Coin","Buys","Paper in","Worth now","Return"],lw.coins.map(c=>[`<b>${esc(c.coin)}</b>`,c.buys,"$"+num(c.cost,0),"$"+num(c.value,0),pc(c.ret)])),
  `<p class="s">${esc(lw.words||"")}</p>`+(lw.new&&lw.new.length?`<p class="s">New today: ${lw.new.map(n=>esc(n[1])+" on "+esc(fd(n[0]))).join(", ")}.</p>`:"")+`<p class="s"><b>The rule:</b> ${esc(lw.rule)}</p><p class="m">Paper only, US$, no costs. File: ${esc(lw.file)}.</p>`);
 h+=`<h3 style="margin:16px 4px 8px">Sandbox books (new ideas)${q("sandbox")}</h3>`+(x.error_note?`<p class="dn">${esc(x.error_note)}</p>`:"")+x.sandbox.map(one).join("");
 h+=card("House rules",`<details><summary>${x.rules.length} rules</summary>`+x.rules.map(r=>`<p class="s">• ${esc(r)}</p>`).join("")+`<p class="m">${esc(x.costs)}</p></details>`);return h};

V.history=()=>{const H=D.history;if(una(H))return card("History",una(H));
 if(!H.n_days)return card("History",`<p class="s">No daily records yet. The first one is saved with the next morning brief.</p>`);
 const since=r=>r.whole?`since records began (${esc(fd(r.since))})`:`since ${esc(fd(r.since))}`;
 const sq=s=>`<div class="strip" role="img" aria-label="state by day, oldest first">${s.split("").map(c=>`<i class="${c=="-"?"N":c}"></i>`).join("")}</div>`;
 let h=card("How each signal has changed",`<p class="s">Records began ${esc(fd(H.start))}: ${H.n_days} day${H.n_days>1?"s":""} so far. One square is one day, oldest on the left${H.dates.length<H.n_days?` (the last ${H.dates.length} days)`:""}.</p>
  <div class="lg"><span><i style="background:var(--mid)"></i>OFF</span><span><i style="background:var(--warn)"></i>ARMED</span><span><i style="background:var(--s1)"></i>ON</span></div>`+
  H.signals.map(r=>`<div class="row"><b>${esc(r.name)}</b><p class="s">${pill(r.now,r.now=="ON"?(red(r.kind)?"on":"go"):r.now=="ARMED"?"arm":"")} ${since(r)}</p>${sq(r.strip)}</div>`).join(""),H.dates[H.dates.length-1]);
 h+=card("Lab calls and market mood",H.calls.map(r=>`<div class="row"><b>${esc(r.name)}</b><p>${esc(r.now==null?"unavailable":r.now)} <span class="m">${since(r)}</span></p></div>`).join("")||`<p class="m">None recorded.</p>`);
 let last="";h+=card("Every change, newest first",H.changes.length?H.changes.map(c=>{const d=c.date!=last?`<h3>${esc(fd(c.date))}</h3>`:"";last=c.date;return d+arrow(c)}).join(""):`<p class="s">No changes recorded yet. A line appears here each time a signal or a lab call changes.</p>`);
 h+=card("Where the full record lives",`<p class="s">Every morning the full snapshot (all signals, closing prices, paper books and the watchlist) is saved on the Mac in <b>~/marketlab/history/</b>, one file per day, named by date. Files are never overwritten or deleted. This page shows only the summary.</p>`);
 return h};

V.glossary=()=>{const e=Object.entries(G).filter(([k])=>!["off","armed","on"].includes(k)).sort((a,b)=>a[1][0].localeCompare(b[1][0]));
 return card("The three states",["off","armed","on"].map(k=>`<p>${pill(G[k][0],k=="on"?"go":k=="armed"?"arm":"")} ${esc(G[k][1])}</p>`).join("")+`<p class="m">For the danger warning, ON is shown in red because it is a warning, not a buy setup.</p>`)+
  card("Glossary",`<p class="s">Every "?" on the dashboard opens one of these.</p><dl class="gl">${e.map(([k,v])=>`<dt>${esc(v[0])}</dt><dd>${esc(v[1])}</dd>`).join("")}</dl>`)};

function help(k){const g=G[k];if(!g)return;document.getElementById("ht").textContent=g[0];document.getElementById("hd").textContent=g[1];document.getElementById("help").hidden=false}
document.addEventListener("click",e=>{const b=e.target.closest(".q");if(b){e.preventDefault();e.stopPropagation();help(b.dataset.g);return}
 if(e.target.closest("#help")){document.getElementById("help").hidden=true;return}
 const m=e.target.closest("[data-more]");if(m){const on=m.closest(".card").classList.toggle("all");m.textContent=on?"Show fewer":m.dataset.more}},true);
document.addEventListener("keydown",e=>{if(e.key=="Escape")document.getElementById("help").hidden=true});

function show(k,secId){if(!V[k])k="overview";cid=0;for(const c in charts)delete charts[c];killLW();
 document.getElementById("main").replaceChildren($(V[k]()));Object.keys(charts).forEach(draw);Object.keys(LW).forEach(mountLW);if(k=="divers"&&!D.divers.error)heat("m12");
 document.querySelectorAll("nav button").forEach(b=>{b.classList.toggle("on",b.dataset.k==k);if(b.dataset.k==k)b.scrollIntoView({inline:"center",block:"nearest"})});
 history.replaceState(null,"","#"+k);const el=secId&&document.getElementById("s-"+secId);if(el)el.scrollIntoView({block:"start"});else window.scrollTo(0,0);CUR=k}
let CUR="overview";
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>show(CUR))}catch(e){}
document.getElementById("nav").innerHTML=TABS.map(t=>`<button data-k="${t[0]}">${t[1]}</button>`).join("");
document.getElementById("nav").onclick=e=>{if(e.target.dataset.k)show(e.target.dataset.k)};
document.getElementById("built").textContent=`Built ${D.dow} ${D.built} Halifax time · paper and research only`;
document.getElementById("foot").textContent=D.disclaimer+" Paper-book values only; no account information. Sources: Yahoo Finance, FRED, Bank of Canada, OECD, Statistics Canada, Federal Reserve, Binance, public news feeds.";
show(location.hash.slice(1)||"overview");
</script></body></html>
