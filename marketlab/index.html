V.watch=()=>{const x=D.watch;if(una(x))return card("Watchlist",una(x));
 const one=(r,name)=>r.missing?`<div class="row"><b>${esc(name)}</b> <span class="m">data unavailable</span></div>`:`<div class="row"><b>${esc(name)}</b> ${num(r.price)} ${spark(r.spark)} <span class="m">${esc(r.date)}</span>
  <p class="s">From high ${pct(r.off_high,0)} · vs 200-day ${pct(r.vs200)} · strength ${r.rel==null?"(benchmark)":pct(r.rel)+` <span class="m">vs ${esc(r.rel_to)}</span>`} · volume ${r.vol==null?"n/a":r.vol.toFixed(2)+"x its yearly average"}</p><p class="s"><b>History:</b> ${esc(r.hist)}</p></div>`;
 let h=card("Coins",x.coins.map(c=>one(c,c.t)).join("")+`<p class="m">${esc(x.hist_asof)}</p>`);
 h+=card("Funds",x.funds.map(f=>one(f,`${f.t} · ${f.label}`)).join("")+`<p class="m">${esc(x.hist_asof)}</p>`);
 const a=x.ant;let b=a.trading?`<p class="hero">$${num(a.price,2)} · ${sp(a.since)} since the day-one open ($${num(a.open0,2)})</p><p class="s">Trading day ${a.day}.${a.compare?` The typical tech IPO at ${esc(a.compare.at)}: ${a.compare.typ>0?"+":""}${a.compare.typ}% (up ${a.compare.up}% of the time).`:""}</p>`:`<p>${esc(a.text)}</p>`;
 if(a.typical)b+=`<h3>How 47 past tech IPOs moved from the day-one open</h3>`+tbl(["After","Typical move","Share that were up"],a.typical.map(t=>[esc(t[3]),(t[1]>0?"+":"")+t[1]+"%",t[2]+"%"]));
 h+=card("ANT (Anthropic)",b+`<p class="m">Data only. No opinion. ${esc(a.src)}.</p>`,a.date);return h};

V.events=()=>{const x=D.events;if(una(x))return card("World events",una(x));
 const c=v=>v==null?'<span class="m">too soon</span>':pct(v);
 let h=card("Which kinds of events have mattered",tbl(["Kind","Cases","Sector fund","1 day","5 days","20 days"],x.summary.map(s=>[esc(s.category),s.n,esc(s.fund),c(s.r1),c(s.r5),c(s.r20)]))+`<p class="m">Typical (median) move of the sector fund minus the S&P 500. Few cases: read as a record, not a rule.</p><p class="m">${esc(x.how)}</p>`+(x.notes.length?`<p class="m">Today: ${x.notes.map(esc).join("; ")}.</p>`:""),x.date);
 h+=card("Event log",x.rows.map(r=>`<div class="row"><b>${esc(r.date)}</b> ${pill(r.category)} ${r.origin=="live"?"":'<span class="m">history</span>'}<p>${esc(r.event)}</p><p class="s">${esc(r.etf)} vs S&P: 1 day ${c(r.r1)} · 5 days ${c(r.r5)} · 20 days ${c(r.r20)}${r.sources?` <span class="m">(${esc(r.sources)})</span>`:""}</p></div>`).join("")||`<p class="m">No events yet.</p>`);
 return h};

V.calendar=()=>{const x=D.calendar;if(una(x))return card("Calendar",una(x));let last="";
 let h=card("Next 2 weeks",(x.items.length?x.items.map(i=>{const d=i.date!=last?`<h3>${esc(i.dow)} ${esc(i.date)}</h3>`:"";last=i.date;return d+`<p>${esc(i.what)} <span class="m">${esc(i.src)}</span></p>`}).join(""):`<p class="s">Nothing found for the next two weeks.</p>`)+x.notes.map(n=>`<p class="m">${esc(n)}</p>`).join(""),x.asof);
 h+=card("Next big dates",Object.entries(x.next).map(([k,v])=>`<p>${esc(k)}: <b>${esc(v)}</b></p>`).join("")||`<p class="m">Data unavailable</p>`);return h};

V.paper=()=>{const x=D.paper;if(una(x))return card("Paper lab",una(x));
 const one=b=>{if(b.error)return `<div class="row"><b>${esc(b.name)}</b> ${pill("problem","on")}<p class="s">${esc(b.error)}</p></div>`;
  if(!b.running)return `<div class="row"><b>${esc(b.name)}</b> ${pill("not started")}<p class="s">${esc(b.rule||"")}</p><p class="m">${esc(b.note||"")}</p>${b.success?`<p class="m">Success would be: ${esc(b.success)}</p>`:""}</div>`;
  return `<div class="row"><b>${esc(b.name)}</b> ${b.early?pill("too early to judge","arm"):""} ${b.stopped?pill("stopped"):""}
  ${tbl(["","Book",esc(b.bench_name||"Buy and hold")],[["Return",pct(b.ret),pct(b.bench_ret)],["Worst drop",pct(b.dd),pct(b.bench_dd)],["Trades",b.trades==null?NA:b.trades,""],["Costs paid",b.costs==null?'<span class="m">not recorded</span>':"$"+num(b.costs,2),b.bench_costs!=null?"$"+num(b.bench_costs,2):""],["Value",usd(b.value),b.bench_value!=null?usd(b.bench_value):""]])}
  <p class="m">Running ${b.days} days, since ${esc(b.since)}. Data to ${esc(b.asof)}.${b.note?" "+esc(b.note):""}</p>${b.rule?`<p class="s">${esc(b.rule)}</p>`:""}${b.holding?`<p class="s">Holding: ${Object.entries(b.holding).map(([k,v])=>esc(k)+" "+(v*100).toFixed(0)+"%").join(", ")}${b.pending?" · order waiting for the next close":""}</p>`:""}${b.success?`<p class="m">Success would be: ${esc(b.success)}</p>`:""}
  ${b.series&&b.series.length>2?chart([{name:"Book",pts:b.series.map(s=>[s[0],s[1]])},{name:"Buy and hold",pts:b.series.map(s=>[s[0],s[2]])}],{h:140}):""}</div>`};
 let h=card("Core books (frozen rules, read only)",x.core.map(one).join("")||`<p class="m">Data unavailable</p>`);
 h+=card("Sandbox books (new ideas)",(x.error_note?`<p class="dn">${esc(x.error_note)}</p>`:"")+x.sandbox.map(one).join(""));
 h+=card("House rules",x.rules.map(r=>`<p class="s">• ${esc(r)}</p>`).join("")+`<p class="m">${esc(x.costs)}</p>`);return h};

function show(k){if(!V[k])k="overview";cid=0;for(const c in charts)delete charts[c];
 document.getElementById("main").replaceChildren($(V[k]()));Object.keys(charts).forEach(draw);if(k=="divers"&&!D.divers.error)heat("m12");
 document.querySelectorAll("nav button").forEach(b=>{b.classList.toggle("on",b.dataset.k==k);if(b.dataset.k==k)b.scrollIntoView({inline:"center",block:"nearest"})});
 history.replaceState(null,"","#"+k);window.scrollTo(0,0)}
document.getElementById("nav").innerHTML=TABS.map(t=>`<button data-k="${t[0]}">${t[1]}</button>`).join("");
document.getElementById("nav").onclick=e=>{if(e.target.dataset.k)show(e.target.dataset.k)};
document.getElementById("built").textContent=`Built ${D.dow} ${D.built} Halifax time · paper and research only`;
document.getElementById("foot").textContent=D.disclaimer+" Paper-book values only; no account information. Sources: Yahoo Finance, FRED, Bank of Canada, OECD, Statistics Canada, Federal Reserve, Binance, public news feeds.";
show(location.hash.slice(1)||"overview");
</script></body></html>
