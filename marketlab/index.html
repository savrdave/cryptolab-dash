:root{--page:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--mute:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--good:#006300;--goodbg:#0ca30c;--warn:#fab219;--bad:#d03b3b;--badtx:#b02a2a;--mid:#f0efec;--chip:#efeee9}

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{padding:14px 16px 6px}h1{font-size:19px;margin:0}.sub{color:var(--mute);font-size:12px}
nav{position:sticky;top:0;z-index:5;background:var(--page);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--grid);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}

main{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--grid);border-radius:12px;padding:13px 14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h2 small{font-weight:400;color:var(--mute);font-size:11px;white-space:nowrap}
h3{font-size:13px;margin:12px 0 4px;color:var(--ink2)}
.hero{font-size:17px;font-weight:600;line-height:1.35}
p{margin:6px 0}.m{color:var(--mute);font-size:12px}.s{font-size:13px;color:var(--ink2)}
.row{padding:9px 0;border-top:1px solid var(--grid)}.row:first-of-type{border-top:0}
.row b{font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--chip);color:var(--ink2);white-space:nowrap}
.pill.on{background:var(--bad);color:#fff}.pill.go{background:var(--goodbg);color:#fff}.pill.arm{background:var(--warn);color:#0b0b0b}
.up{color:var(--good)}.dn{color:var(--badtx)}
.tw{overflow-x:auto;margin:0 -4px}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 6px;text-align:right;border-top:1px solid var(--grid);white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--mute);font-weight:500;font-size:11px;border-top:0}th:first-child,td:first-child{text-align:left;white-space:normal;min-width:104px}
td.l,th.l{text-align:left;white-space:normal}
details{margin-top:4px}summary{color:var(--s1);font-size:12px;cursor:pointer}
svg{display:block;width:100%;height:auto;touch-action:pan-y}.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin:4px 0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.tip{font-size:12px;color:var(--ink2);min-height:18px;font-variant-numeric:tabular-nums}
.idea{border-left:3px solid var(--s1);padding:2px 0 2px 10px;margin:10px 0}
.seg{display:inline-flex;border:1px solid var(--grid);border-radius:8px;overflow:hidden;margin:4px 0}.seg button{border:0;background:none;color:var(--ink2);padding:5px 12px;font:inherit;font-size:13px}
.seg button.on{background:var(--ink);color:var(--page)}
.hm{display:grid;gap:1px;font-size:10px;align-items:center}.hm span{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.hm div{aspect-ratio:1;border-radius:2px}
footer{color:var(--mute);font-size:11px;padding:8px 16px 28px;max-width:760px;margin:0 auto}
.warn{border-color:var(--bad)}.spk{width:64px;display:inline-block;vertical-align:middle}
.q{position:relative;display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--axis);background:none;color:var(--ink2);font:600 11px/1 inherit;padding:0;margin-left:5px;vertical-align:middle;cursor:pointer;flex:none}
.q::after{content:"";position:absolute;inset:-9px}
#help{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
#help[hidden]{display:none}
#help .hb{background:var(--card);color:var(--ink);border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));max-width:760px;width:100%;border-top:1px solid var(--grid)}
#help p{margin:6px 0 12px;font-size:15px}#help button{border:1px solid var(--grid);background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 18px;font:inherit}
.sig .means{color:var(--ink2);font-size:13px;margin:4px 0}.sig .st{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:5px 0}
.dist{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.need{border-left:3px solid var(--warn);padding-left:9px}
.more{display:block;width:100%;margin-top:10px;border:1px solid var(--grid);background:var(--chip);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:14px}
.card:not(.all) .xtra{display:none}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:2px 6px;font-size:13px;font-variant-numeric:tabular-nums;margin-top:5px}
.g5 span{white-space:nowrap}.g5.hd{font-size:11px;color:var(--mute);border-bottom:1px solid var(--grid);padding-bottom:6px;margin-top:8px}
.g5.hd span{white-space:normal;display:flex;align-items:center}
.sum{font-weight:600;font-size:15px;margin:0 0 6px}
.strip{display:flex;flex-wrap:wrap;gap:2px;margin:5px 0 2px}.strip i{width:9px;height:14px;border-radius:2px;background:var(--mid)}
.strip i.A{background:var(--warn)}.strip i.O{background:var(--s1)}.strip i.N{background:none;border:1px dashed var(--axis)}
.gl dt{font-weight:600;margin-top:12px}.gl dd{margin:2px 0 0;color:var(--ink2);font-size:14px}
</style></head><body>

function heat(k){const x=D.divers,n=x.labels.length,el=document.getElementById("hm");if(!el)return;
 const col=v=>v==null?"var(--mid)":`color-mix(in oklab, ${v>=0?"var(--s2)":"var(--s1)"} ${Math.round(Math.min(1,Math.abs(v))*100)}%, var(--mid))`;
 let h=`<div class="hm" style="grid-template-columns:78px repeat(${n},1fr)">`;
 x[k].forEach((r,i)=>{h+=`<span>${esc(x.labels[i])}</span>`+r.map((v,j)=>`<div style="background:${i==j?"var(--grid)":col(v)}" data-i="${i}" data-j="${j}"></div>`).join("")});
 el.innerHTML=h+"</div>";el.onclick=el.onpointermove=e=>{const d=e.target.dataset;if(d&&d.i!=null&&d.i!=d.j)document.getElementById("hmt").innerHTML=`${esc(x.labels[d.i])} and ${esc(x.labels[d.j])}: <b>${x[k][d.i][d.j].toFixed(2)}</b> (3 months ${x.m3[d.i][d.j].toFixed(2)}, 1 year ${x.m12[d.i][d.j].toFixed(2)})`};
 document.querySelectorAll("#hmseg button").forEach(b=>{b.classList.toggle("on",b.dataset.k==k);b.onclick=()=>heat(b.dataset.k)})}

V.watch=()=>{const x=D.watch;if(una(x))return card("Watchlist",una(x));const S=5;

 const one=(r,name,i)=>r.missing?`<div class="row${i>=S?" xtra":""}"><b>${esc(name)}</b> <span class="m">data unavailable</span></div>`:`<div class="row${i>=S?" xtra":""}"><b>${esc(name)}</b> ${num(r.price)} ${spark(r.spark)} <span class="m">${esc(fd(r.date))}</span>
  <div class="g5"><span>${pc(r.d7)}</span><span>${pct(r.d30,0)}</span><span>${pct(r.d90,0)}</span><span>${pct(r.off_high,0)}</span><span>${r.rel==null?'<span class="m">yardstick</span>':pct(r.rel,0)}</span></div>
  <details><summary>More: trend, volume, what history says</summary><p class="s">vs 200-day average${q("vs200")}: ${pct(r.vs200)} · volume${q("volume")}: ${r.vol==null?"n/a":r.vol.toFixed(2)+"x its yearly average"}${r.rel==null?"":` · strength is measured vs ${esc(r.rel_to)}`}</p><p class="s"><b>What history says:</b> ${esc(r.hist)}</p></details></div>`;
 let h=card("Read this first",`<p class="s"><b>Own change vs comparison.</b> The first three numbers are how much each asset's own price moved over 7, 30 and 90 days. "From high" is how far it sits below its peak.</p>
  <p class="s"><b>Why compare with bitcoin (or an index)?</b> Most coins move with bitcoin, and most funds move with the stock market. The last number shows whether an asset did better (+) or worse (−) than just holding bitcoin, or the plain index, over 3 months. An asset can be down and still be holding up well.</p>
  <p class="m">Each list shows the ${S} that moved most over 7 days, up or down. Tap "Show all" for the rest. Only the 7-day column is coloured.</p>`);
 const co=bySwing(x.coins),fu=bySwing(x.funds);
 h+=card("Coins",(x.coins_line?`<p class="sum">${esc(x.coins_line)}</p>`:"")+hd("BTC")+co.map((c,i)=>one(c,c.t,i)).join("")+more(co.length,S,"coins")+`<p class="m">${esc(x.hist_asof)}</p>`);
 h+=card("Funds",(x.funds_line?`<p class="sum">${esc(x.funds_line)}</p>`:"")+hd("IDX")+fu.map((f,i)=>one(f,`${f.t} · ${f.label}`,i)).join("")+more(fu.length,S,"funds")+`<p class="m">${esc(x.hist_asof)}</p>`);
 const a=x.ant;let b=a.trading?`<p class="hero">$${num(a.price,2)} · ${sp(a.since)} since the day-one open ($${num(a.open0,2)})</p><p class="s">Trading day ${a.day}.${a.compare?` The typical tech IPO at ${esc(a.compare.at)}: ${a.compare.typ>0?"+":""}${a.compare.typ}% (up ${a.compare.up}% of the time).`:""}</p>`:`<p>Not trading yet. It lists on ${esc(fd(a.listing))}; numbers appear after its first close.</p>`;
 if(a.typical)b+=`<details><summary>How 47 past tech IPOs moved from the day-one open</summary>`+tbl(["After","Typical move","Share that were up"],a.typical.map(t=>[esc(t[3]),(t[1]>0?"+":"")+t[1]+"%",t[2]+"%"]))+`</details>`;
 h+=card("ANT (Anthropic)",b+`<p class="m">Data only. No opinion. ${esc(a.src)}.</p>`,a.date);return h};

 let h=card("How each signal has changed",`<p class="s">Records began ${esc(fd(H.start))}: ${H.n_days} day${H.n_days>1?"s":""} so far. One square is one day, oldest on the left${H.dates.length<H.n_days?` (the last ${H.dates.length} days)`:""}.</p>
  <div class="lg"><span><i style="background:var(--mid)"></i>OFF</span><span><i style="background:var(--warn)"></i>ARMED</span><span><i style="background:var(--s1)"></i>ON</span></div>`+
  H.signals.map(r=>`<div class="row"><b>${esc(r.name)}</b><p class="s">${pill(r.now,r.now=="ON"?(r.kind=="warning"?"on":"go"):r.now=="ARMED"?"arm":"")} ${since(r)}</p>${sq(r.strip)}</div>`).join(""),H.dates[H.dates.length-1]);
 h+=card("Lab calls and market mood",H.calls.map(r=>`<div class="row"><b>${esc(r.name)}</b><p>${esc(r.now==null?"unavailable":r.now)} <span class="m">${since(r)}</span></p></div>`).join("")||`<p class="m">None recorded.</p>`);
 let last="";h+=card("Every change, newest first",H.changes.length?H.changes.map(c=>{const d=c.date!=last?`<h3>${esc(fd(c.date))}</h3>`:"";last=c.date;return d+arrow(c)}).join(""):`<p class="s">No changes recorded yet. A line appears here each time a signal or a lab call changes.</p>`);
