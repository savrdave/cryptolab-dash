const $=(s)=>document.querySelector(s);
const pct=(x,d=1,s=true)=>x==null?"–":((s&&x>0?"+":"")+(x*100).toFixed(d)+"%");
const usd=(x)=>x==null?"–":"$"+Math.round(x).toLocaleString("en-US");
const cls=(x)=>x==null?"":(x>=0?"pos":"neg");
const css=(v)=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function card(html){return '<div class="card">'+html+'</div>'}
function tbl(h,rows){return '<div class="scroll"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>'}
function legend(s){return '<div class="legend">'+s.map(x=>'<span><i style="background:'+css(x.c)+'"></i>'+x.n+'</span>').join('')+'</div>'}
// series: [{n,c,pts:[[Date,v]],dash}]  opts: {log,h:[{v,c}],fmt,ymin,ymax}
function chart(series,o={}){
 const W=340,H=200,L=46,R=8,T=8,B=22;let xs=[],ys=[];
 series.forEach(s=>s.pts.forEach(p=>{if(p[1]!=null){xs.push(+p[0]);ys.push(p[1])}}));
 if(!xs.length)return '<p class="mut">No data yet.</p>';
 let x0=Math.min(...xs),x1=Math.max(...xs);if(x1==x0)x1=x0+864e5;
 let y0=o.ymin!=null?o.ymin:Math.min(...ys),y1=o.ymax!=null?o.ymax:Math.max(...ys);
 (o.h||[]).forEach(h=>{y0=Math.min(y0,h.v);y1=Math.max(y1,h.v)});
 if(y1==y0){y1=y0*1.01+1e-9;y0=y0*0.99}
 const f=o.log?Math.log10:(v)=>v;const fy0=f(y0),fy1=f(y1);const pad=(fy1-fy0)*0.05;
 const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>H-B-(f(v)-(fy0-pad))/((fy1+pad)-(fy0-pad))*(H-B-T);
 let g='<svg viewBox="0 0 '+W+' '+H+'">';
 let yt=[];if(o.log){for(let e=Math.floor(fy0);e<=Math.ceil(fy1);e++)[1,2,5].forEach(m=>{const v=m*Math.pow(10,e);if(v>=y0*0.9&&v<=y1*1.1)yt.push(v)})}
 else{const st=(y1-y0)/4;for(let i=0;i<=4;i++)yt.push(y0+st*i)}
 if(yt.length>7)yt=yt.filter((_,i)=>i%2==0);
 yt.forEach(v=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="'+css('--line')+'"/><text x="'+(L-5)+'" y="'+(Y(v)+3)+'" font-size="9" text-anchor="end" fill="'+css('--mut')+'">'+(o.fmt?o.fmt(v):v)+'</text>'});
 const span=(x1-x0)/864e5,d0=new Date(x0),d1=new Date(x1);let xt=[];
 if(o.xdays){[[-365,'−1y'],[-182,'−6m'],[0,'today'],[182,'+6m'],[365,'+1y']].forEach(t=>{if(t[0]>=x0&&t[0]<=x1)xt.push(t)})}
 else if(span>800){for(let y=d0.getUTCFullYear()+1;y<=d1.getUTCFullYear();y++)xt.push([Date.UTC(y,0,1),String(y)])}
 else{const n=4;for(let i=0;i<=n;i++){const t=x0+(x1-x0)*i/n,d=new Date(t);xt.push([t,d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})])}}
 if(xt.length>7)xt=xt.filter((_,i)=>i%2==0);
 xt.forEach(t=>{g+='<text x="'+X(t[0])+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" fill="'+css('--mut')+'">'+t[1]+'</text>'});
 (o.h||[]).forEach(h=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(h.v)+'" y2="'+Y(h.v)+'" stroke="'+css(h.c)+'" stroke-dasharray="4 3"/>'});
 series.forEach(s=>{let d='',pen=false;s.pts.forEach(p=>{if(p[1]==null){pen=false;return}d+=(pen?'L':'M')+X(+p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1);pen=true});
  g+='<path d="'+d+'" fill="none" stroke="'+css(s.c)+'" stroke-width="'+(s.w||1.8)+'"'+(s.dash?' stroke-dasharray="3 3"':'')+'/>';
  if(s.dots)s.pts.forEach(p=>{if(p[1]!=null)g+='<circle cx="'+X(+p[0])+'" cy="'+Y(p[1])+'" r="2.6" fill="'+css(s.c)+'"/>'})});
 return g+'</svg>';
}
const dt=s=>new Date(s+'T00:00:00Z');
function today(){
 const m=D.meta||{},lv={0:"CASH",0.5:"HALF IN",1:"FULLY IN"}[m.exposure]||"?";
 const p=m.p_market==null?null:Math.max(0,Math.min(1,m.p_market));
 let h=card('<div class="lbl">Today\'s call · '+(m.date||'')+' close</div><div class="big '+lv.split(' ')[0]+'">'+lv+'</div>'+
  '<div class="meter"><span style="left:'+(p*100)+'%"></span></div><div class="ticks"><span>cash</span><span>45</span><span>55</span><span>fully in</span></div>'+
  '<div class="mut">Model score '+(p==null?'–':(p*100).toFixed(0))+'. This is a score, not real odds: the model is overconfident. Read it as cash / half / fully in.</div>');
 h+=card('<div class="grid2"><div class="kv"><span class="lbl">BTC</span><b>'+usd(D.btc_price)+'</b></div>'+
  '<div class="kv"><span class="lbl">vs 200-day avg</span><b class="'+cls(D.btc_vs_200d)+'">'+pct(D.btc_vs_200d)+'</b></div>'+
  '<div class="kv"><span class="lbl">200-day rule says</span><b>'+(D.above_200d?'IN':'OUT')+'</b></div>'+
  '<div class="kv"><span class="lbl">Last call change</span><b>'+(D.last_flip||'–')+'</b></div></div>');
 const L=(D.levels||[]);
 if(L.length)h+=card('<div class="lbl">What BTC did in the next 30 days at each call (backtest)</div>'+
  tbl(['Call','Period','Days','% up','Avg move'],L.map(r=>[r.level,r.period,r.days,pct(r.up,0,false),'<span class="'+cls(r.avg)+'">'+pct(r.avg)+'</span>'])) +
  '<div class="mut">Days overlap, so the real sample is small. 2024+ was already seen while building the model.</div>');
 if(D.top_coins)h+=card('<div class="lbl">Coin ranking (for reference, coin picking failed its tests)</div>'+tbl(['Coin','Score'],D.top_coins));
 $('#today').innerHTML=h;
}
function tracker(){
 const H=D.history,b=D.books||{},s0=D.start_cash;let h='';
 const ps=D.paper_state||{};
 const days=ps.started?Math.round((dt(ps.last_date)-dt(ps.started))/864e5):0;
 h+=card('<div class="lbl">Paper portfolio · day '+days+' of ~90</div>'+tbl(['Book','Value','Return'],Object.entries(b).filter(e=>e[1]!=null).map(e=>[e[0],usd(e[1]),'<span class="'+cls(e[1]/s0-1)+'">'+pct(e[1]/s0-1,2)+'</span>'])));
 if(H&&H.date&&H.date.length){
  const S=[['timing_btc_equity','Timing → BTC','--c1'],['btc_equity','BTC hold','--c2'],['equity','Full system','--c3'],['alts_equity','Top-10 alts','--c4'],['v4_equity','v4','--c5']].filter(x=>H[x[0]]);
  h+=card('<div class="lbl">Growth of $'+s0.toLocaleString()+'</div>'+chart(S.slice().reverse().map(x=>({n:x[1],c:x[2],pts:H.date.map((d,i)=>[dt(d),H[x[0]][i]])})),{fmt:v=>'$'+(v/1000).toFixed(1)+'k'})+legend(S.map(x=>({n:x[1],c:x[2]}))));
 }
 const tb=b["Timing → BTC (official)"],bh=b["BTC buy & hold"];
 h+=card('<div class="lbl">3-month pass check (verdict ~late Jan 2027)</div>'+
  '<div class="chk"><b>'+days+'/90</b><span>Days run</span></div>'+
  '<div class="chk"><b>'+(tb&&bh?pct(tb/bh-1,1):'–')+'</b><span>Timing → BTC vs BTC hold. Fails only if it trails by more than its worst backtest stretch.</span></div>'+
  '<div class="chk"><b>manual</b><span>Clean runs, calls follow the rules, "in" days beat "out" days: checked at the verdict.</span></div>'+
  '<div class="mut">A few weeks of results mean very little. Don\'t judge before the end.</div>');
 if(D.trades&&D.trades.length){const k=Object.keys(D.trades[0]).slice(0,5);h+=card('<div class="lbl">Recent paper trades</div>'+tbl(k,D.trades.map(t=>k.map(x=>t[x]))))}
 else h+=card('<div class="lbl">Recent paper trades</div><div class="mut">None yet. The model has been in cash.</div>');
 $('#tracker').innerHTML=h;
}
function signals(){

function backtest(){
 let h=card('<div class="lbl">Results per year (after fees)</div>'+tbl(['Strategy','2017–23','worst','2024+','worst'],(D.backtest||[]).map(r=>[r.name,'<span class="'+cls(r.dev_cagr)+'">'+pct(r.dev_cagr,0)+'</span>',pct(r.dev_dd,0),'<span class="'+cls(r.lock_cagr)+'">'+pct(r.lock_cagr,0)+'</span>',pct(r.lock_dd,0)]))+
  '<div class="mut">Timing → BTC is the official model. v4 sizing and coin picking failed their pre-set targets. 2024+ has been opened '+D.lockbox_opens+' time(s), so it is no longer a clean test. Only the live paper run is fresh.</div>');
 const E=D.lock_equity;if(E){const S=[['Timing model -> BTC','Timing → BTC','--c1'],['BTC buy & hold','BTC hold','--c2'],['BTC 200-day rule','200-day rule','--c3']].filter(x=>E[x[0]]);
  h+=card('<div class="lbl">$1 from Jan 2024 (seen, not a clean test)</div>'+chart(S.map(x=>({n:x[1],c:x[2],pts:E.date.map((d,i)=>[dt(d),E[x[0]][i]])})),{fmt:v=>'$'+v.toFixed(2)})+legend(S.map(x=>({n:x[1],c:x[2]}))))}
 h+=card('<div class="lbl">Honesty counter</div><div><b>'+D.n_experiments+'</b> experiments logged (cap ~8). Every extra one makes a lucky result more likely.</div><div class="mut">Parked: #6 futures funding (no free source back to 2018 from Canada).</div>');

function cyc(){
 const c=D.cycle;if(!c){$('#cycle').innerHTML=card('<div class="mut">Cycle data unavailable.</div>');return}

 h+=card('<div class="lbl">Every cycle at day '+c.day+'</div>'+tbl(['Cycle','x halving price','off cycle high','next 90d','next 365d'],c.table.map(r=>[r.cycle,r.x_halving_price.toFixed(2)+'x',pct(r.drawdown_from_cycle_high,0),'<span class="'+cls(r.next_90d)+'">'+pct(r.next_90d,0)+'</span>','<span class="'+cls(r.next_365d)+'">'+pct(r.next_365d,0)+'</span>'])));
 const cols=['--c2','--c3','--c4','--c1'],ks=Object.keys(c.rebased||{});

}
function evs(){

const tabs=['today','tracker','signals','backtest','cycle','events'],done={};

function show(){const t=tabs.includes(location.hash.slice(1))?location.hash.slice(1):'today';

 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+t));
 if(!done[t]){try{draw[t]()}catch(e){document.getElementById(t).innerHTML=card('<div class="mut">Could not draw this tab: '+e.message+'</div>')}done[t]=1}window.scrollTo(0,0)}
