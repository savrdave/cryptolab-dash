<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#18202c;--mut:#5f6878;--line:#dfe3ea;--acc:#2f5bd3;--soft:#eef2fb;

@media (prefers-color-scheme:dark){:root{--bg:#10141b;--card:#171d26;--fg:#e7eaf0;--mut:#9aa3b3;--line:#283040;--soft:#1e2635;
--acc:#7ea2ff;--c1:#7ea2ff;--c2:#7d8696;--c3:#f0a050;--c4:#5cc28d;--c5:#c792ea;--good:#5cc28d;--bad:#ef7b72;--mid:#e0b44a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
h1{font-size:1.05rem;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
h1 small{font-weight:400;color:var(--mut);font-size:.75rem}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{flex:0 0 auto;padding:8px 12px;color:var(--mut);text-decoration:none;font-weight:600;font-size:.88rem}
nav a.on{color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
main{max-width:760px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lbl{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.i{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font:700 .85rem/1 system-ui;cursor:pointer;padding:0}
.i[aria-expanded="true"]{background:var(--acc);color:var(--card)}
.exp{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:.9rem;line-height:1.5}
.exp p{margin:0 0 6px}.exp p:last-child{margin:0}
.big{font-size:2rem;font-weight:800;line-height:1.1}
.CASH{color:var(--bad)}.HALF{color:var(--mid)}.FULLY{color:var(--good)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{display:flex;flex-direction:column}.kv b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:.85rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:.76rem}
th:first-child,td:first-child{text-align:left}
.pos{color:var(--good)}.neg{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.meter{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad) 0 45%,var(--mid) 45% 55%,var(--good) 55% 100%);opacity:.85}
.meter span{position:absolute;top:-4px;width:4px;height:20px;background:var(--fg);border-radius:2px;transform:translateX(-2px)}
.ticks{display:flex;justify-content:space-between;font-size:.7rem;color:var(--mut)}
.chk{display:flex;gap:10px;align-items:flex-start}.chk b{min-width:4.4em;font-size:.8rem}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar button{font:600 .78rem system-ui;padding:5px 9px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.bar button.on{border-color:var(--acc);color:var(--acc);background:var(--soft)}
.bar .sp{flex:1}
.plot{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.plot svg{width:100%;height:auto;display:block}
.tip{min-height:2.6em;font-size:.82rem;font-variant-numeric:tabular-nums;background:var(--soft);border-radius:6px;padding:5px 9px;line-height:1.35}
.tip b{font-weight:700}
.calls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.calls div{border:1px solid var(--line);border-radius:8px;padding:8px 4px}
.calls b{display:block;font-size:.95rem}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
</style></head><body>

function today(){
 const m=D.meta||{},lv=LV[m.exposure]||"?";
 const p=m.p_market==null?null:Math.max(0,Math.min(1,m.p_market));
 const meaning={"CASH":"The model would hold no Bitcoin right now. All cash.","HALF IN":"The model would hold half in Bitcoin, half in cash.","FULLY IN":"The model would hold everything in Bitcoin."}[lv]||'';
 let h=card("Today's call · "+(m.date||'')+' close',
  '<div class="big '+lv.split(' ')[0]+'">'+lv+'</div><div>'+meaning+'</div>'+
  '<div class="calls"><div><b class="CASH">CASH</b>0% Bitcoin</div><div><b class="HALF">HALF IN</b>50% Bitcoin</div><div><b class="FULLY">FULLY IN</b>100% Bitcoin</div></div>'+
  '<div class="meter"><span style="left:'+(p*100)+'%"></span></div><div class="ticks"><span>0</span><span>45</span><span>55</span><span>100</span></div>'+
  '<div class="mut">Model score today: '+(p==null?'–':(p*100).toFixed(0))+' (black marker).</div>',
  P('Every evening the model looks at Bitcoin\'s trend, the market, and the economy, and gives one of three calls. The call says how much of your crypto money it would put in Bitcoin.',
    '<b>CASH</b> = 0% in Bitcoin. <b>HALF IN</b> = 50%. <b>FULLY IN</b> = 100%.',
    'The call comes from a score. Under 45 = cash, 45 to 55 = half in, 55 and up = fully in.',
    'The score is <b>not</b> the real chance Bitcoin goes up. Testing showed the model is overconfident. Only the three calls matter.'));
 const agree=(D.above_200d?1:0)==(m.exposure>0?1:0);
 h+=card('Bitcoin right now','<div class="grid2"><div class="kv"><span class="lbl">Price</span><b>'+usd(D.btc_price)+'</b></div>'+
  '<div class="kv"><span class="lbl">vs 200-day average</span><b class="'+cls(D.btc_vs_200d)+'">'+pct(D.btc_vs_200d)+'</b></div>'+
  '<div class="kv"><span class="lbl">Simple 200-day rule</span><b>'+(D.above_200d?'IN':'OUT')+'</b></div>'+
  '<div class="kv"><span class="lbl">Model last changed call</span><b>'+(D.last_flip||'–')+'</b></div></div>'+
  '<div class="mut">'+(agree?'The model and the simple rule agree today.':'The model and the simple rule <b>disagree</b> today: the rule says '+(D.above_200d?'IN':'OUT')+', the model says '+lv+'.')+'</div>',
  P('<b>200-day average</b>: Bitcoin\'s average price over the last 200 days, about 6½ months. Above it usually means a long-term uptrend. Below it usually means a downtrend.',
    '<b>Simple 200-day rule</b>: the easiest strategy there is. Own Bitcoin when the price is above its 200-day average, hold cash when below. Our model has to beat this rule, or it isn\'t worth using.',
    '<b>Model last changed call</b>: the last day the model moved between cash, half and fully in.'));
 const L=(D.levels||[]);
 if(L.length)h+=card('Report card: Bitcoin over the 30 days after each call',
  tbl(['Call','Years','Days','% up','Avg'],L.map(r=>[r.level,r.period,r.days,pct(r.up,0,false),'<span class="'+cls(r.avg)+'">'+pct(r.avg)+'</span>'])),
  P('This checks if the model has been useful. For every past day it said CASH, HALF IN or FULLY IN, it looks at what Bitcoin did over the next 30 days.',
    'If the model works, FULLY IN days should beat CASH days. They do. In 2024+, Bitcoin averaged −2.6% after CASH calls and +6.3% after FULLY IN calls.',
    '<b>% up</b> = share of those days when Bitcoin was higher 30 days later. <b>Avg</b> = Bitcoin\'s average change over those 30 days.',
    'Two cautions. Neighbouring days overlap, so the real sample is small. And 2024+ was already looked at while building the model, so it isn\'t a clean test.'));
 const W=(D.watch||[]).filter(r=>!r.missing),miss=(D.watch||[]).filter(r=>r.missing).map(r=>r.coin);
 const crow=r=>[r.coin,usd(r.price),'<span class="'+cls(r.d30)+'">'+pct(r.d30,0)+'</span>','<span class="'+cls(r.v200)+'">'+pct(r.v200,0)+'</span>','<span class="neg">'+pct(r.off_high,0)+'</span>'];
 const ch=['Coin','Price','30 days','vs 200-day','off its high'];
 const coinExp=P('The model only decides <b>how much</b> to have in crypto. It doesn\'t pick <b>which</b> coins. Coin picking was tested and failed: its gains came only from bubble years, with a −91% drop. So today\'s call ('+lv+') applies to every coin here.',
    '<b>30 days</b> = price change over the last 30 days.',
    '<b>vs 200-day</b> = how far the coin is above (+) or below (−) its own average price over the last 200 days. Below usually means it\'s still in a downtrend.',
    '<b>off its high</b> = how far below its all-time high it is. −90% means it would need to rise 10x to get back there.',
    '"Coins you watch" = today\'s top 20 by market value, updated automatically every night. "Coins you hold" is set in config.py (DASH_COINS_HELD).');
 const H1=W.filter(r=>r.held),H2=W.filter(r=>!r.held);
 if(H1.length)h+=card('Coins you hold',tbl(ch,H1.map(crow)),coinExp);
 if(H2.length)h+=card('Coins you watch · today\'s top 20',tbl(ch,H2.map(crow))+(miss.length?'<div class="mut">No price data for: '+miss.join(', ')+'</div>':''),coinExp);
 $('#today').innerHTML=h;
}
function tracker(){
 const H=D.history,b=D.books||{},s0=D.start_cash||10000,ps=D.paper_state||{};
 const days=ps.started?Math.round((dt(ps.last_date)-dt(ps.started))/864e5):0;
 let h=card('Paper portfolio · day '+days+' of about 90',
  tbl(['Book','Value now','Return'],Object.entries(b).filter(e=>e[1]!=null).map(e=>[e[0],usd(e[1]),'<span class="'+cls(e[1]/s0-1)+'">'+pct(e[1]/s0-1,2)+'</span>'])),
  P('Pretend money. Each "book" started with $10,000 on '+(ps.started||'Oct 30')+'. All books pay realistic trading fees.',
    '<b>Timing → BTC (official)</b>: follows the daily call and buys only Bitcoin. This is the one being judged.',
    '<b>Full system</b>: follows the call but buys the model\'s top-ranked coins.',
    '<b>Timing → top-10 alts</b> and <b>v4</b>: side versions being watched, if shown.',
    '<b>BTC buy & hold</b>: buys Bitcoin on day one and never sells. This is what the model has to beat.'));
 if(H&&H.date&&H.date.length){
  const S=[['timing_btc_equity','Timing → BTC','--c1',2.4],['btc_equity','BTC hold','--c2',1.8],['equity','Full system','--c3',1.6],['alts_equity','Top-10 alts','--c4',1.6],['v4_equity','v4','--c5',1.6]].filter(x=>H[x[0]]&&H[x[0]].some(v=>v!=null));
  h+=card('Growth of $'+s0.toLocaleString('en-US'),chartBox({series:S.slice().reverse().map(x=>({n:x[1],c:x[2],w:x[3],pts:H.date.map((d,i)=>[dt(d),H[x[0]][i]])})),fmt:v=>'$'+(v/1000).toFixed(1)+'k',tip:usd,legend:S.map(x=>({n:x[1],c:x[2]})),height:190}),
   P('What each book\'s $10,000 is worth each day. Higher is better.','A flat line means that book is sitting in cash.','Press and hold to see the exact value on any date.'));
 }
 const tb=b["Timing → BTC (official)"],bh=b["BTC buy & hold"];
 h+=card('3-month pass check (verdict around late January 2027)',
  '<div class="chk"><b>'+days+' / 90</b><span>Days run so far</span></div>'+
  '<div class="chk"><b class="'+cls(tb&&bh?tb/bh-1:null)+'">'+(tb&&bh?pct(tb/bh-1,1):'–')+'</b><span>Official book vs BTC buy & hold</span></div>'+
  '<div class="chk"><b>at end</b><span>Runs clean, calls follow the rules, "in" days beat "out" days</span></div>',
  P('After about 3 months we decide whether the model has earned trust with real money. It passes if:',
    '1. The nightly runs keep working.<br>2. Every paper trade follows the rules.<br>3. The official book hasn\'t fallen behind buy & hold by more than its worst stretch in testing.<br>4. Days it was in Bitcoin did better than days it was out.',
    'Right now it\'s behind because Bitcoin rose while the model sat in cash. A few days or weeks tells us almost nothing, so don\'t judge before the end.'));
 if(D.trades&&D.trades.length){const k=Object.keys(D.trades[0]).slice(0,5);h+=card('Recent paper trades',tbl(k,D.trades.map(t=>k.map(x=>t[x]))))}
 else h+=card('Recent paper trades','<div class="mut">None yet. The model has been in cash the whole time.</div>');
 $('#tracker').innerHTML=h;mountCharts();
}
function signals(){
 const bt=(D.signal_bt||[]).map(r=>[dt(r[0]),r[1]]),lv=(D.live_calls||[]).map(r=>[dt(r[0]),r[1]]);
 const btcS=(D.btc_daily||[]).map(r=>[dt(r[0]),r[1]]);
 const callOf=v=>v<D.low?'CASH':(v>=D.high?'FULLY IN':'HALF IN');
 let h=card('Model score every day since 2017',chartBox({series:[{n:'Score',c:'--c2',pts:bt,w:1.2},{n:'Live',c:'--c1',pts:lv,dots:true}],ymin:0.15,ymax:0.95,
   h:[{v:D.low,c:'--bad'},{v:D.high,c:'--good'}],fmt:v=>(v*100).toFixed(0),tip:v=>(v*100).toFixed(0)+' = '+callOf(v),
   extra:t=>{const i=bs(btcS,t);return i>=0?'BTC '+usd(btcS[i][1]):''},
   legend:[{n:'score (backtest)',c:'--c2'},{n:'live calls',c:'--c1'},{n:'45 line',c:'--bad'},{n:'55 line',c:'--good'}]}),
  P('The model\'s score for every day since 2017. Above the green line (55) = FULLY IN. Between the lines = HALF IN. Below the red line (45) = CASH.',
    '<b>Grey line</b>: what the model would have said each day, using only data available on that day.',
    '<b>Blue dots</b>: real live calls since Oct 30.',
    '<b>Zoom</b>: pinch with two fingers, or tap 1M / 3M / 1Y / 3Y. Tap All to reset.',
    '<b>Read a point</b>: press and hold, then slide your finger. Below the chart you\'ll see the date, the score, and Bitcoin\'s price that day.'));
 h+=card('Bitcoin price',chartBox({series:[{n:'BTC',c:'--c3',pts:btcS}],log:true,canLog:true,fmt:v=>v>=1000?'$'+(v/1000).toFixed(v>=10000?0:1)+'k':'$'+Math.round(v),tip:usd,
   extra:t=>{const i=bs(bt,t);return i>=0&&Math.abs(+bt[i][0]-t)<5*864e5?'model '+callOf(bt[i][1]):''}}),
  P('Bitcoin\'s daily price since 2017.',
    '<b>Log scale</b> (the default): each step up the side is the same <b>percentage</b> jump, not the same dollar jump. Bitcoin went from about $1,000 to over $100,000. On a normal scale the early years look flat. On log scale, doubling from $1k to $2k looks the same size as doubling from $50k to $100k.',
    'Tap <b>Scale</b> to switch to plain dollars and back. Zoom and press-and-hold work the same as the chart above.'));
 const lc=(D.live_calls||[]).slice().reverse();
 h+=card('Live daily calls',lc.length?tbl(['Date','Score','Call'],lc.map(r=>[r[0],(r[1]*100).toFixed(0),r[2]])):'<div class="mut">None yet.</div>',
  P('Every real call since the paper run started. Score is the model\'s number, not real odds. Call is what it means: cash, half in or fully in.'));
 $('#signals').innerHTML=h;mountCharts();
}
function backtest(){
 let h=card('How each strategy did in testing',tbl(['Strategy','2017–23 per yr','worst drop','2024+ per yr','worst drop'],(D.backtest||[]).map(r=>[r.name,'<span class="'+cls(r.dev_cagr)+'">'+pct(r.dev_cagr,0)+'</span>',pct(r.dev_dd,0),'<span class="'+cls(r.lock_cagr)+'">'+pct(r.lock_cagr,0)+'</span>',pct(r.lock_dd,0)])),
  P('How each strategy would have done on past data, after fees. "Per yr" is the average yearly gain.',
    '<b>2017–23</b> = the years used to build the model. <b>2024+</b> = the final exam, held back until the end.',
    'The final exam has now been opened '+D.lockbox_opens+' times, so it\'s no longer a clean test. Only the live paper run gives fresh evidence now.',
    '<b>Worst drop</b> = the biggest fall from a high point. −28% means $10,000 fell to $7,200 at its worst moment.',
    '<b>Timing → BTC</b> is the official model. v4 sizing and coin picking failed their tests, so they are shown for comparison only.'));
 const E=D.lock_equity;if(E){const S=[['Timing model -> BTC','Timing → BTC','--c1',2.4],['BTC buy & hold','BTC hold','--c2',1.6],['BTC 200-day rule','200-day rule','--c3',1.6]].filter(x=>E[x[0]]);
  h+=card('$1 invested in January 2024',chartBox({series:S.slice().reverse().map(x=>({n:x[1],c:x[2],w:x[3],pts:E.date.map((d,i)=>[dt(d),E[x[0]][i]])})),fmt:v=>'$'+v.toFixed(2),tip:v=>'$'+v.toFixed(2),legend:S.map(x=>({n:x[1],c:x[2]}))}),
   P('What $1 would have grown to in each strategy since January 2024. Higher is better.','Flat stretches on the blue line are when the model sat in cash. Press and hold to read any date.'))}
 h+=card('Honesty counter','<div><b>'+D.n_experiments+'</b> experiments tried, out of a cap of about 8.</div><div class="mut">Parked: #6 futures funding. No free data source reaches back to 2018 from Canada.</div>',
  P('Every new idea tested on the same history raises the chance that one looks good just by luck. So we cap the tries and count every one.'));
 $('#backtest').innerHTML=h;mountCharts();
}
function cyc(){
 const c=D.cycle;if(!c){$('#cycle').innerHTML=card('Cycle','<div class="mut">Cycle data unavailable.</div>');return}
 let h=card('Bitcoin halving cycle','<div class="grid2"><div class="kv"><span class="lbl">Days since last halving</span><b>'+c.day+'</b></div><div class="kv"><span class="lbl">Days to next (estimate)</span><b>'+c.to_next+'</b></div></div>',
  P('About every 4 years, the new Bitcoin paid to miners is cut in half. This is called the <b>halving</b>. The last one was April 2024, and the next is expected around spring 2028.',
    'Past cycles had a similar rhythm: a big rise in the year or so after a halving, then a big crash. This tab lines up each past cycle at the same point we\'re at now.',
    'Only 3 past cycles exist. This is history, not a prediction.'));
 h+=card('Every cycle at day '+c.day,tbl(['Cycle','vs halving price','below cycle high','next 90 days','next year'],c.table.map(r=>[r.cycle,r.x_halving_price.toFixed(2)+'x',pct(r.drawdown_from_cycle_high,0),'<span class="'+cls(r.next_90d)+'">'+pct(r.next_90d,0)+'</span>','<span class="'+cls(r.next_365d)+'">'+pct(r.next_365d,0)+'</span>'])),
  P('For each halving year, where Bitcoin was at this same day-count:',
    '<b>vs halving price</b>: 1.24x means the price was 1.24 times what it was on halving day.',
    '<b>below cycle high</b>: how far under that cycle\'s peak so far.',
    '<b>next 90 days / next year</b>: what happened after. Blank = hasn\'t happened yet (that\'s us).'));
 const cols=['--c2','--c3','--c4','--c1'],ks=Object.keys(c.rebased||{});
 h+=card('Each cycle around this point, reset to 1.0 today',chartBox({series:ks.map((k,i)=>({n:k,c:cols[i%4],w:k==ks[ks.length-1]?2.6:1.4,pts:c.rebased[k]})),log:true,xdays:true,fmt:v=>v+'x',tip:v=>v.toFixed(2)+'x',legend:ks.map((k,i)=>({n:k+' halving',c:cols[i%4]}))}),
  P('Each line is a past cycle, lined up so "today" is the same day-count after its halving, and its price that day is set to 1.0.',
    'Left of "today" is the year before. Right is what happened next: 0.5x means the price halved, 2x means it doubled.',
    'The thick blue line is the current cycle, so it stops at today.'));
 $('#cycle').innerHTML=h;mountCharts();
}
function evs(){
 let h='';const s=D.events_summary||[];
 if(s.length)h+=card('By type of event',tbl(['Type','Count','7 days','30 days','90 days'],s.map(r=>[r.category,r.n,pct(r.vs_typical_7d,0),pct(r.vs_typical_30d,0),pct(r.vs_typical_90d,0)])),
  P('Big news events, grouped by type, with what Bitcoin did afterwards <b>compared with its normal move</b> at that time. So +5% means 5 points better than usual.',
    'The events were chosen with hindsight, so treat this as history, not a trading signal.'));
 const e=D.events||[];
 if(e.length)h+=card('Events, newest first',tbl(['Date','7 days','30 days','90 days','Event'],e.map(r=>[r.date,'<span class="'+cls(r.after_7d)+'">'+pct(r.after_7d,0)+'</span>','<span class="'+cls(r.after_30d)+'">'+pct(r.after_30d,0)+'</span>','<span class="'+cls(r.after_90d)+'">'+pct(r.after_90d,0)+'</span>','<span style="white-space:normal;display:inline-block;min-width:12em;text-align:left">'+r.event+'</span>'])),
  P('Bitcoin\'s price change in the 7, 30 and 90 days after each event. Swipe the table sideways to read the event name.'));
 $('#events').innerHTML=h||card('Events','<div class="mut">No events.</div>');
}
$('#built').textContent='updated '+D.built;
const tabs=['today','tracker','signals','backtest','cycle','events'],done={};
const draw={today,tracker,signals,backtest,cycle:cyc,events:evs};
function show(){const t=tabs.includes(location.hash.slice(1))?location.hash.slice(1):'today';
 tabs.forEach(x=>{document.getElementById(x).hidden=x!=t});
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+t));
 if(!done[t]){try{draw[t]()}catch(e){document.getElementById(t).innerHTML=card('Error','<div class="mut">Could not draw this tab: '+e.message+'</div>')}done[t]=1}window.scrollTo(0,0)}
addEventListener('hashchange',show);show();
</script></body></html>
